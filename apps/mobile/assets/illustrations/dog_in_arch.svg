<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 300" role="img" aria-label="A dog framed in an arch">
  <!-- FurFeel brand arch (ADR-022; matches the mood board's arch, but the
       stroke is our accent teal, not gold). Tinted ground so the warm dog sits
       on a cool frame — deliberate complementary contrast. -->
  <!-- sparkles -->
  <g fill="#14B8A6">
    <path d="M44 60 q2 -12 4 0 q12 2 0 4 q-2 12 -4 0 q-12 -2 0 -4 z"/>
    <path d="M206 92 q1.6 -10 3.2 0 q10 1.6 0 3.2 q-1.6 10 -3.2 0 q-10 -1.6 0 -3.2 z"/>
  </g>
  <path d="M198 46 q1.4 -9 2.8 0 q9 1.4 0 2.8 q-1.4 9 -2.8 0 q-9 -1.4 0 -2.8 z" fill="#2563EB"/>
  <!-- arch frame -->
  <path d="M44 150 A76 88 0 0 1 196 150 L196 250 Q196 262 184 262 L56 262 Q44 262 44 250 Z"
        fill="#E7EEFD" stroke="#14B8A6" stroke-width="3"/>
  <!-- dog head, tucked in the arch -->
  <g>
    <!-- ears -->
    <path d="M92 108 q-26 2 -26 34 q0 18 12 26 q4 -34 22 -48 z" fill="#E7BE93"/>
    <path d="M148 108 q26 2 26 34 q0 18 -12 26 q-4 -34 -22 -48 z" fill="#E7BE93"/>
    <!-- head -->
    <ellipse cx="120" cy="130" rx="40" ry="37" fill="#F3DCBC"/>
    <!-- muzzle -->
    <ellipse cx="120" cy="146" rx="20" ry="15" fill="#FBF0DC"/>
    <!-- nose -->
    <path d="M112 138 q8 -6 16 0 q0 8 -8 11 q-8 -3 -8 -11 z" fill="#16233F"/>
    <path d="M120 149 v5 M120 154 q-6 4 -11 1 M120 154 q6 4 11 1" stroke="#16233F" stroke-width="2.3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- eyes -->
    <circle cx="104" cy="126" r="4.6" fill="#16233F"/>
    <circle cx="136" cy="126" r="4.6" fill="#16233F"/>
    <circle cx="102.6" cy="124.4" r="1.6" fill="#FFFFFF"/>
    <circle cx="134.6" cy="124.4" r="1.6" fill="#FFFFFF"/>
  </g>
</svg>
