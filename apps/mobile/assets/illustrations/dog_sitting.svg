<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 230" role="img" aria-label="A friendly dog sitting">
  <!-- FurFeel illustration set (ADR-022). Flat vector, no gradients/shadows.
       Warm cream dog = the one warm element; brand-blue collar is the single
       cool accent (and where the harness sits). Reads on both the light and
       dark #0B1220 grounds because the cream body carries the silhouette. -->
  <!-- tail: a clear upward curl behind the haunch -->
  <path d="M166 150 q34 6 28 -30" stroke="#E7BE93" stroke-width="15" fill="none" stroke-linecap="round"/>
  <!-- haunches -->
  <ellipse cx="120" cy="154" rx="54" ry="48" fill="#F3DCBC"/>
  <!-- front legs -->
  <rect x="99" y="140" width="18" height="62" rx="9" fill="#F3DCBC"/>
  <rect x="123" y="140" width="18" height="62" rx="9" fill="#F3DCBC"/>
  <!-- paws -->
  <ellipse cx="108" cy="200" rx="12" ry="9" fill="#FBF0DC"/>
  <ellipse cx="132" cy="200" rx="12" ry="9" fill="#FBF0DC"/>
  <!-- ears -->
  <path d="M86 58 q-30 2 -30 40 q0 20 14 30 q4 -40 24 -56 z" fill="#E7BE93"/>
  <path d="M154 58 q30 2 30 40 q0 20 -14 30 q-4 -40 -24 -56 z" fill="#E7BE93"/>
  <!-- head -->
  <ellipse cx="120" cy="84" rx="44" ry="40" fill="#F3DCBC"/>
  <!-- muzzle -->
  <ellipse cx="120" cy="101" rx="22" ry="17" fill="#FBF0DC"/>
  <!-- nose -->
  <path d="M111 92 q9 -7 18 0 q0 9 -9 12 q-9 -3 -9 -12 z" fill="#16233F"/>
  <!-- mouth -->
  <path d="M120 104 v6 M120 110 q-7 5 -13 1 M120 110 q7 5 13 1" stroke="#16233F" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- eyes -->
  <circle cx="103" cy="80" r="5" fill="#16233F"/>
  <circle cx="137" cy="80" r="5" fill="#16233F"/>
  <circle cx="101.4" cy="78" r="1.7" fill="#FFFFFF"/>
  <circle cx="135.4" cy="78" r="1.7" fill="#FFFFFF"/>
  <!-- collar -->
  <path d="M92 116 q28 22 56 0" stroke="#2563EB" stroke-width="12" fill="none" stroke-linecap="round"/>
  <circle cx="120" cy="130" r="6.5" fill="#14B8A6"/>
</svg>
